<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body class="body">
  <header class="header">
    <img class="img" src="./eisenhower-matrix.jpg" alt="The eisenhower matrix.">
    <a class="link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>
  <main class="main">
    <section id="section">
      <h1 class="title title-new-task" for="new-task">Add Item</h1>
      <div class="wrapper">
        <input id="new-task" class="input input-new-task task" type="text">
        <button class="button">Add</button>
      </div>
    </section>
    <section class="section">
      <h3 class="section__title">Todo</h3>
      <ul class="section__list incomplete">
        <li class="section__item">
          <input class="section__checkbox" type="checkbox">
          <label class="section__title-task section__task">Pay Bills</label>
          <input class="section__input section__task" type="text">
          <button class="section__button edit">Edit</button>
          <button class="section__button delete">
            <img class="delete__icon" src="./remove.svg" alt="">
          </button>
        </li>
        <li class="section__item edit-mode">
          <input class="section__checkbox" type="checkbox">
          <label class="section__title-task section__task">Go Shopping</label>
          <input class="section__input section__task" type="text" value="Go Shopping">
          <button class="section__button edit">Save</button>
          <button class="section__button delete">
            <img class="delete__icon" src="./remove.svg" alt="">
          </button>
        </li>
      </ul>
    </section>
    <section class="section">
      <h3 class="section__title">Completed</h3>
      <ul class="section__list complete">
        <li class="section__item">
          <input class="section__checkbox" type="checkbox" checked>
          <label class="section__title-task section__task">See the Doctor</label>
          <input class="section__input section__task" type="text">
          <button class="section__button edit">Edit</button>
          <button class="section__button delete">
            <img class="delete__icon" src="./remove.svg" alt="">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
